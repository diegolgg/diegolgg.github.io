<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Modulus</n  <style>
    body { margin: 0; font-family: sans-serif; }
    #toolbar { padding:1rem; background:#fafafa; position: relative; }
    #howto-btn { position: absolute; top:1rem; right:1rem; }
    .wrapper { display: flex; height: calc(100vh - 72px); }
    .game { flex: 2; padding: 1rem; display: flex; flex-direction: column; align-items: center; }
    #grid { display: grid; gap: 2px; margin-top: 1rem; }
    .tile { background: white; border: 1px solid #ccc; }
    .black { background: black; }
    .diagnostics { flex: 1; padding: 1rem; border-left: 1px solid #ddd; overflow-y: auto; }
    #current-run { margin-bottom: 1rem; }
    details { margin-top: 1rem; }
    details summary { cursor: pointer; font-weight: bold; }
    details ul { list-style: none; padding-left: 1rem; }
    details li { margin: 0.5rem 0; cursor: pointer; color: blue; text-decoration: underline; }
    canvas { max-width: 100%; }
    #howto { display:none; position:absolute; top:50px; right:20px; background:white; border:1px solid #ccc; padding:1rem; width:300px; box-shadow:0 2px 6px rgba(0,0,0,0.2); }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div id="toolbar">
    n: <input id="input-n" type="number" value="5" min="1" style="width:4ch">
    m: <input id="input-m" type="number" value="5" min="1" style="width:4ch">
    mod: <input id="input-mod" type="number" value="5" min="1" style="width:4ch">
    sec: <input id="input-sec" type="number" value="5" min="1" style="width:4ch">
    <button id="start-btn">Start</button>
    <span>Press space to stop</span>
    <button id="howto-btn">How to play</button>
    <div id="howto">
      <h3>How to play</h3>
      <p><strong>n</strong>: number of columns in the grid.</p>
      <p><strong>m</strong>: number of rows in the grid.</p>
      <p><strong>mod</strong>: modulus value (tiles count mod this number).</p>
      <p><strong>sec</strong>: seconds before timeout.</p>
      <p>Count the blacked-out tiles, enter the result <em>mod</em> via keyboard (0–9).</p>
      <p>Correct: P += 0.01; Wrong/timeout: P -= 0.05.</p>
      <p>Press <strong>Space</strong> to stop.</p>
    </div>
  </div>
  <div class="wrapper">
    <div class="game">
      <div id="info">P: <span id="P-display">0.00</span></div>
      <div id="timer">Time left: <span id="time-left">0</span>s</div>
      <div id="grid"></div>
    </div>
    <div class="diagnostics">
      <div id="current-run">
        <strong>Current Run:</strong><br>
        n=<span id="cur-n">–</span>, 
        m=<span id="cur-m">–</span>, 
        mod=<span id="cur-mod">–</span>, 
        sec=<span id="cur-sec">–</span>s<br>
        Best P: <span id="bestP">0.00</span>
      </div>
      <canvas id="chart"></canvas>
      <details>
        <summary>Run History</summary>
        <ul id="run-history"></ul>
      </details>
    </div>
  </div>
  <script>
    let n,m,modVal,sec,P=0,bestP=0, timer,timeInterval, paused=false;
    const runs = [];
    const gridEl = document.getElementById('grid');
    const Pdisp = document.getElementById('P-display');
    const bestPdisp = document.getElementById('bestP');
    const timeDisp = document.getElementById('time-left');
    const curN = document.getElementById('cur-n');
    const curM = document.getElementById('cur-m');
    const curMod = document.getElementById('cur-mod');
    const curSec = document.getElementById('cur-sec');
    const historyEl = document.getElementById('run-history');
    const ctx = document.getElementById('chart').getContext('2d');
    const data = { labels:[], datasets:[{ label:'P over trials', data:[], borderColor:'blue', fill:false }]};
    const chart = new Chart(ctx, { type:'line', data, options:{ scales:{ x:{ title:{display:true,text:'Trial'} }, y:{ min:0,max:1 } } } });
    document.getElementById('start-btn').onclick = ()=>{ if(chart.data.labels.length) saveRun(); n=+document.getElementById('input-n').value; m=+document.getElementById('input-m').value; modVal=+document.getElementById('input-mod').value; sec=+document.getElementById('input-sec').value*1000; P=bestP=0; updateCurrentInfo(); resetChart(); newRound(); };
    document.getElementById('howto-btn').onclick = ()=>{ let d=document.getElementById('howto'); d.style.display=(d.style.display==='none'||!d.style.display)?'block':'none'; };
    document.addEventListener('keydown', e=>{
      if(e.code==='Space'){ paused=!paused; if(paused){clearTimeout(timer);clearInterval(timeInterval);} else newRound(); }
      if(!paused && e.key.match(/^\d+$/)){
        clearTimeout(timer); clearInterval(timeInterval);
        const guess = +e.key;
        const actual = window.currentCount % modVal;
        if(guess===actual) P=Math.min(1,P+0.01); else P=Math.max(0,P-0.05);
        if(P>bestP){bestP=P;bestPdisp.textContent=bestP.toFixed(2);} pushChartPoint(P); updateCurrentInfo(); newRound();
      }
    });
    historyEl.addEventListener('click', e=>{ if(e.target.tagName==='LI'){ loadRun(+e.target.dataset.idx); }});
    function updateCurrentInfo(){ Pdisp.textContent=P.toFixed(2); bestPdisp.textContent=bestP.toFixed(2); curN.textContent=n; curM.textContent=m; curMod.textContent=modVal; curSec.textContent=sec/1000; }
    function resetChart(){ chart.data.labels=[]; chart.data.datasets[0].data=[]; chart.update(); }
    function pushChartPoint(val){ chart.data.labels.push(chart.data.labels.length+1); chart.data.datasets[0].data.push(val); chart.update(); }
    function saveRun(){ const run={config:{n,m,mod:modVal,sec:sec/1000},bestP,labels:[...chart.data.labels],data:[...chart.data.datasets[0].data]}; runs.push(run); const li=document.createElement('li'); li.textContent=`#${runs.length}: n=${n},m=${m},mod=${modVal},sec=${(sec/1000)}s, bestP=${bestP.toFixed(2)}`; li.dataset.idx=runs.length-1; historyEl.append(li);}    
    function loadRun(idx){ const run=runs[idx]; curN.textContent=run.config.n; curM.textContent=run.config.m; curMod.textContent=run.config.mod; curSec.textContent=run.config.sec; bestPdisp.textContent=run.bestP.toFixed(2); chart.data.labels=[...run.labels]; chart.data.datasets[0].data=[...run.data]; chart.update(); }
    function newRound(){ if(paused) return; const availW=window.innerWidth*0.66, availH=(window.innerHeight-80)*0.66; const sizeW=Math.floor(availW/n), sizeH=Math.floor(availH/m), size=Math.min(sizeW,sizeH); gridEl.style.gridTemplateColumns=`repeat(${n},${size}px)`; gridEl.style.gridTemplateRows=`repeat(${m},${size}px)`; gridEl.innerHTML=''; let count=0; for(let i=0;i<n*m;i++){ const d=document.createElement('div'); d.className='tile'; d.style.width=`${size}px`; d.style.height=`${size}px`; if(Math.random()<P){d.classList.add('black');count++;} gridEl.append(d);} window.currentCount=count; let timeLeft=Math.floor(sec/1000); timeDisp.textContent=timeLeft; clearInterval(timeInterval); timeInterval=setInterval(()=>{timeLeft--; timeDisp.textContent=timeLeft; if(timeLeft<=0)clearInterval(timeInterval);},1000); clearTimeout(timer); timer=setTimeout(()=>{P=Math.max(0,P-0.05); pushChartPoint(P); updateCurrentInfo(); newRound();},sec);}  
  </script>
</body>
</html>

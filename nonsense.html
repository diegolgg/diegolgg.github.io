<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Other Nonsense</title>
  <link rel="stylesheet" href="style.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { background: #fff; }
    #dlaCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; }
  </style>
</head>
<body>
<canvas id="dlaCanvas"></canvas>
<div class="blog-container">
  <div class="blog-post" onclick="toggleContent('post1')">
    <h2>Today’s Musings</h2>
    <div id="post1" class="content">
      <p>This blog post describes what I'm doing right now and my thoughts on ongoing research and projects...</p>
    </div>
  </div>
  <div class="blog-post" onclick="toggleContent('post2')">
    <h2>Another Update</h2>
    <div id="post2" class="content">
      <p>More ideas and notes on my current work. More details to come as the conversation unfolds...</p>
    </div>
  </div>
</div>
<script>
function toggleContent(id){
  var el = document.getElementById(id);
  el.style.display = (el.style.display==="none"||el.style.display==="") ? "block" : "none";
}
var canvas = document.getElementById("dlaCanvas"), ctx = canvas.getContext("2d");
canvas.width = window.innerWidth; canvas.height = window.innerHeight;
var NX = 200, NY = 200;
var grid = new Uint8Array(NX*NY);
for(var i=0;i<grid.length;i++){
  grid[i] = 0;
}
function idx(i,j){ return i+j*NX; }
var centerX = Math.floor(NX/2), centerY = Math.floor(NY/2);
grid[idx(centerX,centerY)] = 1;
function spawnWalker(){
  var angle = Math.random()*2*Math.PI;
  var R = Math.floor(Math.max(NX,NY)/2);
  var x = Math.floor(centerX + R*Math.cos(angle));
  var y = Math.floor(centerY + R*Math.sin(angle));
  return {x: x, y: y};
}
var walkers = [];
function updateWalkers(){
  for(var k = walkers.length-1; k>=0; k--){
    var w = walkers[k];
    var dir = Math.floor(Math.random()*4);
    if(dir === 0) w.x++;
    else if(dir === 1) w.x--;
    else if(dir === 2) w.y++;
    else w.y--;
    if(w.x < 1) w.x = 1; if(w.x >= NX-1) w.x = NX-2;
    if(w.y < 1) w.y = 1; if(w.y >= NY-1) w.y = NY-2;
    if(grid[idx(w.x-1,w.y)]===1 || grid[idx(w.x+1,w.y)]===1 ||
       grid[idx(w.x,w.y-1)]===1 || grid[idx(w.x,w.y+1)]===1){
      grid[idx(w.x,w.y)] = 1;
      walkers.splice(k,1);
    }
  }
}
function renderDLA(){
  var imgData = ctx.createImageData(canvas.width, canvas.height);
  var data = imgData.data;
  for(var j=0;j<NY;j++){
    for(var i=0;i<NX;i++){
      var col = grid[idx(i,j)]===1 ? 50 : 255;
      var x = Math.floor(i*canvas.width/NX);
      var y = Math.floor(j*canvas.height/NY);
      var pos = (y*canvas.width+x)*4;
      data[pos] = col;
      data[pos+1] = col;
      data[pos+2] = 255;
      data[pos+3] = 255;
    }
  }
  ctx.putImageData(imgData,0,0);
}
function animateDLA(){
  for(var i=0;i<5;i++){
    walkers.push(spawnWalker());
  }
  updateWalkers();
  renderDLA();
  requestAnimationFrame(animateDLA);
}
animateDLA();
</script>
</body>
</html>

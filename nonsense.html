<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Expository writing</title>
  <link rel="stylesheet" href="style.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
<div class="scale-container">
  <div class="top-bar" style="border-bottom:none;">
    <!-- No Home link; header removed as per instruction -->
  </div>
  <h1 class="page-title">Expository writing</h1>
  <div class="feed-container" id="feedContainer">
    <div class="lw-post-card">
      <div class="post-card-header">
        <h2 class="post-card-title" onclick="togglePostContent(1)">Miscellaneous writings that I've kept from back in high school</h2>
        <div class="post-card-meta">April 15, 2025</div>
      </div>
      <div class="post-card-snippet">
        
      </div>
      <div class="lw-post-full-content" id="fullContent-1" style="display:none;">
        <p>I'll add these in, don't worry</p>
      </div>
    </div>
  </div>
  <footer class="footer">
    <p>&copy; Diego Luca Gonzalez Gauss 2025</p>
  </footer>
</div>
<script>
function togglePostContent(id){
  const fullContentEl = document.getElementById("fullContent-" + id);
  fullContentEl.style.display = (fullContentEl.style.display==="none" || fullContentEl.style.display==="") ? "block" : "none";
}
</script>
</body>
</html>

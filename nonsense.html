<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Other Nonsense (LessWrong Style)</title>
  <link rel="stylesheet" href="style.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
<div class="top-bar">
  <button class="add-post-btn" onclick="togglePostForm()">Add Post</button>
</div>
<div class="post-form-container" id="postForm" style="display:none;">
  <h2>Create a New Post</h2>
  <label for="postTitle">Title:</label>
  <input type="text" id="postTitle" placeholder="Enter your post title...">
  <label for="postAuthor">Author:</label>
  <input type="text" id="postAuthor" placeholder="Enter your name...">
  <label for="postSnippet">Snippet (short excerpt):</label>
  <textarea id="postSnippet" rows="3" placeholder="A short excerpt to show in the feed..."></textarea>
  <label for="postContent">Full Text:</label>
  <textarea id="postContent" rows="5" placeholder="The full text that appears when expanded..."></textarea>
  <button onclick="submitPost()">Submit</button>
</div>
<div class="feed-container" id="feedContainer"></div>
<script>
const postsData = [
  {
    title: "Evidence of Potential Misalignment in AI",
    author: "UserA",
    time: "5h",
    snippet: "Short excerpt about potential misalignment evidence in advanced AI systems...",
    content: "Full text about misalignment: Lorem ipsum dolor sit amet, ...\nAdditional thoughts or analysis here.\nEven more text to illustrate a fuller body.",
    comments: []
  },
  {
    title: "Should AI Encourage Cooperation?",
    author: "UserB",
    time: "6h",
    snippet: "Snippet: The question of whether AI should push for cooperation or remain neutral.",
    content: "Full text about AI cooperation. Lorem ipsum dolor sit amet, ...\nWe explore various angles here.\nThis is the second line.",
    comments: []
  },
  {
    title: "Interpreting LLM Failures",
    author: "UserC",
    time: "1d",
    snippet: "Snippet: Surprising LLM failures highlight interpretability needs.",
    content: "Full text about LLM interpretability: Lorem ipsum.\nWe expand on the idea that LLM reasoning is hidden.\nHence the need for interpretability methods.",
    comments: []
  }
];
function togglePostForm(){
  const form = document.getElementById("postForm");
  form.style.display = (form.style.display === "none" || form.style.display==="") ? "block" : "none";
}
function submitPost(){
  const title = document.getElementById("postTitle").value.trim();
  const author = document.getElementById("postAuthor").value.trim();
  const snippet = document.getElementById("postSnippet").value.trim();
  const content = document.getElementById("postContent").value.trim();
  if(!title || !author || !snippet || !content) return;
  const newPost = {
    title: title,
    author: author,
    time: "just now",
    snippet: snippet,
    content: content,
    comments: []
  };
  postsData.unshift(newPost);
  renderPosts();
  togglePostForm();
  document.getElementById("postTitle").value="";
  document.getElementById("postAuthor").value="";
  document.getElementById("postSnippet").value="";
  document.getElementById("postContent").value="";
}
function togglePostContent(idx){
  const fullContentEl = document.getElementById(`fullContent-${idx}`);
  if(fullContentEl.style.display==="none"||fullContentEl.style.display==="") {
    fullContentEl.style.display="block";
  } else {
    fullContentEl.style.display="none";
  }
}
function addComment(idx){
  const nameField = document.getElementById(`commentName-${idx}`);
  const commentBox = document.getElementById(`commentText-${idx}`);
  const nameVal = nameField.value.trim();
  const commentVal = commentBox.value.trim();
  if(!nameVal||!commentVal) return;
  postsData[idx].comments.push({name:nameVal, text: commentVal});
  nameField.value="";
  commentBox.value="";
  renderPosts();
  togglePostContent(idx);
}
function renderPosts(){
  const container = document.getElementById("feedContainer");
  container.innerHTML="";
  for(let i=0; i<postsData.length;i++){
    const post=postsData[i];
    const card=document.createElement("div");
    card.className="lw-post-card";
    const topRow=document.createElement("div");
    topRow.className="lw-post-top";
    const titleEl=document.createElement("h2");
    titleEl.className="lw-post-title";
    titleEl.innerText=post.title;
    titleEl.onclick=()=>togglePostContent(i);
    const snippetEl=document.createElement("div");
    snippetEl.className="lw-post-snippet";
    snippetEl.innerText=post.snippet;
    const authorTimeEl=document.createElement("div");
    authorTimeEl.className="lw-post-author-time";
    authorTimeEl.innerText=`${post.author} • ${post.time}`;
    topRow.appendChild(titleEl);
    topRow.appendChild(snippetEl);
    topRow.appendChild(authorTimeEl);
    card.appendChild(topRow);

    const fullContentDiv=document.createElement("div");
    fullContentDiv.className="lw-post-full-content";
    fullContentDiv.id=`fullContent-${i}`;
    fullContentDiv.style.display="none";

    const contentP=document.createElement("p");
    contentP.innerText=post.content;
    fullContentDiv.appendChild(contentP);

    if(post.comments && post.comments.length>0){
      const commentsWrapper=document.createElement("div");
      commentsWrapper.className="lw-comment-section";
      for(const c of post.comments){
        const cDiv=document.createElement("div");
        cDiv.className="lw-comment-row";
        cDiv.innerHTML=`<span class="lw-comment-name">${c.name}</span>: ${c.text}`;
        commentsWrapper.appendChild(cDiv);
      }
      fullContentDiv.appendChild(commentsWrapper);
    }
    const commentAdd=document.createElement("div");
    commentAdd.className="lw-comment-add";
    const labelName=document.createElement("label");
    labelName.innerText="Name:";
    const nameInput=document.createElement("input");
    nameInput.type="text";
    nameInput.id=`commentName-${i}`;
    const labelComment=document.createElement("label");
    labelComment.innerText="Comment:";
    const commentField=document.createElement("textarea");
    commentField.rows=2;
    commentField.id=`commentText-${i}`;
    const submitBtn=document.createElement("button");
    submitBtn.innerText="Submit";
    submitBtn.onclick=()=>addComment(i);

    commentAdd.appendChild(labelName);
    commentAdd.appendChild(nameInput);
    commentAdd.appendChild(labelComment);
    commentAdd.appendChild(commentField);
    commentAdd.appendChild(submitBtn);

    fullContentDiv.appendChild(commentAdd);
    card.appendChild(fullContentDiv);
    container.appendChild(card);
  }
}
renderPosts();
</script>
</body>
</html>

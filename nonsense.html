<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Other Nonsense</title>
<link rel="stylesheet" href="style.css">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body { background: #fff; }
#saffCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; }
</style>
</head>
<body>
<canvas id="saffCanvas"></canvas>
<div class="blog-container">
  <div class="blog-post" onclick="toggleContent('post1')">
    <h2>Today’s Musings</h2>
    <div id="post1" class="content">
      <p>This blog post describes what I'm doing right now and my thoughts on ongoing research and projects...</p>
    </div>
  </div>
  <div class="blog-post" onclick="toggleContent('post2')">
    <h2>Another Update</h2>
    <div id="post2" class="content">
      <p>More ideas and notes on my current work. More details to come as the conversation unfolds...</p>
    </div>
  </div>
</div>
<script>
function toggleContent(id){
 var el=document.getElementById(id);
 el.style.display=(el.style.display==="none"||el.style.display==="")?"block":"none";
}
var canvas=document.getElementById("saffCanvas"),ctx=canvas.getContext("2d");
canvas.width=window.innerWidth;canvas.height=window.innerHeight;
var Nx=120,Ny=120,sx=Nx+2,sy=Ny+2;
function IX(i,j){return i+j*sx;}
var dt=0.03,diff=0.0,visc=0.0005;
var u=new Float32Array(sx*sy),v=new Float32Array(sx*sy),
    u0=new Float32Array(sx*sy),v0=new Float32Array(sx*sy);
var dens=new Float32Array(sx*sy),dens0=new Float32Array(sx*sy);
for(var j2=0;j2<sy;j2++){
  for(var i2=0;i2<sx;i2++){
    dens[IX(i2,j2)]=0.0;
    u[IX(i2,j2)]=0;v[IX(i2,j2)]=0;
  }
}
for(var j2=1;j2<=Ny;j2++){
  for(var i2=1;i2<=Nx;i2++){
    dens0[IX(i2,j2)]=dens[IX(i2,j2)];
  }
}
function add_source(x,s,dt){for(var i=0;i<x.length;i++){x[i]+=dt*s[i];}}
function set_bnd(b,x){
 for(var i=1;i<=Nx;i++){
  x[IX(i,0)]   =b==2?-x[IX(i,1)]:x[IX(i,1)];
  x[IX(i,Ny+1)]=b==2?-x[IX(i,Ny)]:x[IX(i,Ny)];
 }
 for(var j=1;j<=Ny;j++){
  x[IX(0,j)]   =b==1?-x[IX(1,j)]:x[IX(1,j)];
  x[IX(Nx+1,j)]=b==1?-x[IX(Nx,j)]:x[IX(Nx,j)];
 }
 x[IX(0,0)]           =0.5*(x[IX(1,0)]           +x[IX(0,1)]);
 x[IX(0,Ny+1)]        =0.5*(x[IX(1,Ny+1)]        +x[IX(0,Ny)]);
 x[IX(Nx+1,0)]        =0.5*(x[IX(Nx,0)]          +x[IX(Nx+1,1)]);
 x[IX(Nx+1,Ny+1)]     =0.5*(x[IX(Nx,Ny+1)]       +x[IX(Nx+1,Ny)]);
}
function diffuse(b,x,x0,d,dt){
 var a=dt*d*Nx*Ny;
 for(var k=0;k<20;k++){
  for(var j=1;j<=Ny;j++){
   for(var i=1;i<=Nx;i++){
    x[IX(i,j)]=(x0[IX(i,j)]+a*(x[IX(i-1,j)]+x[IX(i+1,j)]+x[IX(i,j-1)]+x[IX(i,j+1)]))/(1+4*a);
   }
  }
  set_bnd(b,x);
 }
}
function advect(b,d,d0,u,v,dt){
 var dtx=dt*Nx,dty=dt*Ny;
 for(var j=1;j<=Ny;j++){
  for(var i=1;i<=Nx;i++){
   var x=i-dtx*u[IX(i,j)],y=j-dty*v[IX(i,j)];
   if(x<0.5)x=0.5;if(x>Nx+0.5)x=Nx+0.5;
   if(y<0.5)y=0.5;if(y>Ny+0.5)y=Ny+0.5;
   var i0=Math.floor(x),i1=i0+1;
   var j0=Math.floor(y),j1=j0+1;
   var s1=x-i0,s0=1-s1,t1=y-j0,t0=1-t1;
   d[IX(i,j)]=s0*(t0*d0[IX(i0,j0)]+t1*d0[IX(i0,j1)])+
               s1*(t0*d0[IX(i1,j0)]+t1*d0[IX(i1,j1)]);
  }
 }
 set_bnd(b,d);
}
function project(u,v,p,div){
 for(var j=1;j<=Ny;j++){
  for(var i=1;i<=Nx;i++){
   div[IX(i,j)]=-0.5*(u[IX(i+1,j)]-u[IX(i-1,j)]+v[IX(i,j+1)]-v[IX(i,j-1)])/Nx;
   p[IX(i,j)]=0;
  }
 }
 set_bnd(0,div);set_bnd(0,p);
 for(var k=0;k<20;k++){
  for(var j=1;j<=Ny;j++){
   for(var i=1;i<=Nx;i++){
    p[IX(i,j)]=(div[IX(i,j)]+p[IX(i-1,j)]+p[IX(i+1,j)]+p[IX(i,j-1)]+p[IX(i,j+1)])/4;
   }
  }
  set_bnd(0,p);
 }
 for(var j=1;j<=Ny;j++){
  for(var i=1;i<=Nx;i++){
   u[IX(i,j)]-=0.5*Nx*(p[IX(i+1,j)]-p[IX(i-1,j)]);
   v[IX(i,j)]-=0.5*Nx*(p[IX(i,j+1)]-p[IX(i,j-1)]);
  }
 }
 set_bnd(1,u);set_bnd(2,v);
}
function velocity_step(u,v,u0,v0,visc,dt){
 add_source(u,u0,dt);add_source(v,v0,dt);
 for(var i=0;i<u0.length;i++){u0[i]=u[i];v0[i]=v[i];}
 diffuse(1,u,u0,visc,dt);diffuse(2,v,v0,visc,dt);
 project(u,v,u0,v0);
 for(var i=0;i<u0.length;i++){u0[i]=u[i];v0[i]=v[i];}
 advect(1,u,u0,u0,v0,dt);advect(2,v,v0,u0,v0,dt);
 project(u,v,u0,v0);
}
function density_step(x,x0,u,v,diff,dt){
 add_source(x,x0,dt);
 for(var i=0;i<x0.length;i++){x0[i]=x[i];}
 diffuse(0,x,x0,diff,dt);
 for(var i=0;i<x0.length;i++){x0[i]=x[i];}
 advect(0,x,x0,u,v,dt);
}
function injectRadial(){
 var cx=Math.floor(Nx/2),cy=Math.floor(Ny/2),r=2;
 for(var j=cy-r;j<=cy+r;j++){
  for(var i=cx-r;i<=cx+r;i++){
   var dx=i-cx,dy=j-cy;
   if(dx*dx+dy*dy<=r*r){
    var idx=IX(i,j);
    dens[idx]=1.0;
    var angle=Math.atan2(dy,dx);
    var spd=2.0;
    u[idx]=spd*Math.cos(angle);
    v[idx]=spd*Math.sin(angle);
   }
  }
 }
}
function step(){
 for(var i=0;i<u0.length;i++){u0[i]=0;v0[i]=0;dens0[i]=0;}
 injectRadial();
 velocity_step(u,v,u0,v0,visc,dt);
 density_step(dens,dens0,u,v,diff,dt);
}
function colorMap(val){
 var hue=220*(1-val);
 var sat=1;
 var light=0.6+0.4*val;
 return hslToRgb(hue,sat,light);
}
function hslToRgb(h,s,l){
 h=((h%360)+360)%360;
 var c=(1-Math.abs(2*l-1))*s,hh=h/60,x=c*(1-Math.abs((hh%2)-1));
 var r=0,g=0,b=0;
 if(hh<1){r=c;g=x;}else if(hh<2){r=x;g=c;}else if(hh<3){g=c;b=x;}else if(hh<4){g=x;b=c;}else if(hh<5){r=x;b=c;}else{r=c;b=x;}
 var m=l-c/2;
 return [Math.round((r+m)*255),Math.round((g+m)*255),Math.round((b+m)*255)];
}
function render(){
 var cellW=canvas.width/Nx,cellH=canvas.height/Ny;
 ctx.clearRect(0,0,canvas.width,canvas.height);
 for(var j=1;j<=Ny;j++){
  for(var i=1;i<=Nx;i++){
   var val=dens[IX(i,j)];
   if(val<0)val=0;if(val>1)val=1;
   var rgb=colorMap(val);
   ctx.fillStyle="rgb("+rgb[0]+","+rgb[1]+","+rgb[2]+")";
   ctx.fillRect((i-1)*cellW,(j-1)*cellH,cellW,cellH);
  }
 }
}
function animate(){
 step();
 render();
 requestAnimationFrame(animate);
}
animate();
</script>
</body>
</html>

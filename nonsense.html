<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Nonsense</title>
  <link rel="stylesheet" href="style.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
<div class="top-bar">
  <div class="top-bar-left">
    <a href="index.html" class="home-link">Home</a>
  </div>
</div>
<h1 class="page-title">Nonsense</h1>
<div class="feed-container" id="feedContainer"></div>
<footer class="footer">
  <p>&copy; Diego Luca Gonzalez Gauss 2025</p>
</footer>
<script>
const postsData = [
  {
    id: 1,
    title: "Evidence of Potential Misalignment in AI",
    author: "UserA",
    time: "5h",
    snippet: "A short excerpt about potential misalignment…",
    content: "Full post content about potential misalignment. Lorem ipsum dolor sit amet...\nAdditional details here."
  },
  {
    id: 2,
    title: "Should AI Encourage Cooperation?",
    author: "UserB",
    time: "6h",
    snippet: "A snippet about whether AI should promote cooperation.",
    content: "Full post content discussing cooperation in AI. Lorem ipsum dolor sit amet...\nFurther discussion follows."
  },
  {
    id: 3,
    title: "LLM Interpretability is Crucial",
    author: "UserC",
    time: "1d",
    snippet: "Snippet: surprising LLM failures highlight interpretability needs.",
    content: "An extended discussion on why interpretability is important for LLMs. Lorem ipsum dolor sit amet...\nContinued analysis here."
  }
];
function togglePostContent(id){
  const fullContentEl = document.getElementById(`fullContent-${id}`);
  fullContentEl.style.display = (fullContentEl.style.display==="none" || fullContentEl.style.display==="") ? "block" : "none";
}
function renderPosts(){
  const container = document.getElementById("feedContainer");
  container.innerHTML = "";
  postsData.forEach((post) => {
    const card = document.createElement("div");
    card.className = "lw-post-card";
    
    const header = document.createElement("div");
    header.className = "post-card-header";
    
    const titleEl = document.createElement("h2");
    titleEl.className = "post-card-title";
    titleEl.innerText = post.title;
    titleEl.onclick = () => togglePostContent(post.id);
    
    const metaEl = document.createElement("div");
    metaEl.className = "post-card-meta";
    metaEl.innerText = `${post.author} • ${post.time}`;
    
    header.appendChild(titleEl);
    header.appendChild(metaEl);
    card.appendChild(header);
    
    const snippetEl = document.createElement("div");
    snippetEl.className = "post-card-snippet";
    snippetEl.innerText = post.snippet;
    card.appendChild(snippetEl);
    
    const fullDiv = document.createElement("div");
    fullDiv.className = "lw-post-full-content";
    fullDiv.id = `fullContent-${post.id}`;
    fullDiv.style.display = "none";
    const contentP = document.createElement("p");
    contentP.innerText = post.content;
    fullDiv.appendChild(contentP);
    
    card.appendChild(fullDiv);
    container.appendChild(card);
  });
}
renderPosts();
</script>
</body>
</html>
